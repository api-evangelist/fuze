name: Fuze
description: >-
  Fuze was a cloud unified-communications-as-a-service (UCaaS) provider offering
  enterprise cloud voice, video conferencing, team messaging, and contact-center
  capabilities for the mobile and distributed workforce. Originally surfaced as a
  portfolio company of Bessemer Venture Partners and Insight Partners, Fuze was
  acquired by 8x8 in 2022; its website (www.fuze.com) now permanently redirects
  (HTTP 301) to 8x8.com/fuze and the Fuze product line has been folded into the
  8x8 platform. No independent Fuze developer portal, API documentation, OpenAPI
  specification, or public API surface could be found during enrichment. This
  profile remains in the API Evangelist network as a stub; the only artifact that
  could be enriched from real signal is a live domain/DNS/TLS security probe of
  fuze.com.
